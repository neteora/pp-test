[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; API (Apache + mod_php)
[program:api]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker: scheduler (tick), dispatch (async) e pubblicazioni (una coda per piattaforma)
[program:worker]
command=php bin/console messenger:consume async scheduler_default publish_instagram --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/html
user=www-data
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker LLM: richieste lente isolate dalle pubblicazioni
[program:worker-llm]
command=php bin/console messenger:consume llm --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/html
user=www-data
autorestart=true
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
