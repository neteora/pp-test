services:
  mysql:
    image: mysql:8.0
    ports:
      - "3350:3306"
    container_name: pp_mysql
    labels:
      description: "pp_mysql - database MySQL e coda dei messaggi"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: postpickr
      MYSQL_USER: postpickr
      MYSQL_PASSWORD: postpickr
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API (Apache) + worker + worker-llm sotto supervisord. Codice montato dal tuo filesystem.
  app:
    build: ./backend
    container_name: pp_app
    labels:
      description: "pp_app - API (Apache) + worker + worker-llm sotto supervisord"
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: dev
      APP_SECRET: change-me
      DATABASE_URL: "mysql://postpickr:postpickr@mysql:3306/postpickr?serverVersion=8.0&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: "^http://localhost:8097$"
    depends_on:
      mysql:
        condition: service_healthy

  # Interfaccia React: dev server Vite, codice montato dal tuo filesystem.
  frontend:
    image: node:20-alpine
    container_name: pp_frontend
    labels:
      description: "pp_frontend - interfaccia React (dev server Vite)"
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8095
    ports:
      - "8097:8081"

volumes:
  mysql_data:
